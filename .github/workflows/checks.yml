name: Checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.13'
            ha: '2025.10.4'
            dns: 'pycares<5'
          - python: '3.14'
            ha: '2026.10.1'
            dns: 'pycares>=5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'homeassistant==${{ matrix.ha }}' '${{ matrix.dns }}' pytest pytest-asyncio aioresponses ruff
      - run: ruff check .
      - run: pytest
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
